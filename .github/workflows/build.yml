name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Build as .preview package (installs alongside an existing MBM)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Prepare Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          echo "Available API 36-39 platforms:"
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]" || true
          "$SDKM" "platforms;android-37.0" || "$SDKM" "platforms;android-37" || echo "Could not preinstall platform 37; Gradle will try to download it"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Build web UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Build debug APK
        run: |
          if [ "${{ inputs.preview }}" = "true" ]; then
            gradle :app:assembleDebug -PqaApplicationIdSuffix=.preview
          else
            gradle :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mbm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
