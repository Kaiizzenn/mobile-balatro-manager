name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Build as .preview package (installs alongside an existing MBM)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 37
        run: sdkmanager "platforms;android-37"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Build web UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Build debug APK
        run: |
          if [ "${{ inputs.preview }}" = "true" ]; then
            gradle :app:assembleDebug -PqaApplicationIdSuffix=.preview
          else
            gradle :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mbm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
